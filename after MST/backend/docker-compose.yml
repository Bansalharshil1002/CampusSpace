# DEVELOPMENT ONLY. For the controlled demo use render.yaml or docker-compose.prod.yml.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: room_status
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/room_status
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      FRONTEND_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
